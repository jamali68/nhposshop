# Netlify Configuration for Taj POS Pro
# Automatically detected by Netlify upon connecting GitHub repository

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA Fallback: Direct all routes to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for maximum performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
