<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taj POS &amp; Cash Manager</title>
    <meta name="description" content="Taj Karyana &amp; Mobile Shop - Complete POS, Daily Cash Book, Easyload Ledger &amp; Khata Management System" />
    <meta property="og:title" content="Taj POS &amp; Cash Manager" />
    <meta property="og:description" content="Taj Karyana &amp; Mobile Shop - Complete POS, Daily Cash Book, Easyload Ledger &amp; Khata Management System" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#2c3e50" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Urdu:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatic fallback for GitHub Pages if repo root is served directly without Vite server
      (function() {
        if (window.location.hostname.indexOf('github.io') !== -1 && !window.location.pathname.includes('/dist')) {
          var cleanPath = window.location.pathname.replace(/\/+$/, '');
          var distUrl = cleanPath + '/dist/' + window.location.search + window.location.hash;
          // Try redirecting to dist immediately
          setTimeout(function() {
            var rootEl = document.getElementById('root');
            if (rootEl && rootEl.childNodes.length === 0) {
              window.location.replace(distUrl);
            }
          }, 600);
        }
      })();
    </script>
  </body>
</html>
