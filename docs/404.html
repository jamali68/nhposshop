    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Immediately capture beforeinstallprompt before any framework loads
      window.deferredInstallPrompt = null;

      function isPwaStandalone() {
        return Boolean(
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: window-controls-overlay)').matches ||
          window.matchMedia('(display-mode: minimal-ui)').matches ||
          window.navigator.standalone === true ||
          (document.referrer && document.referrer.includes('android-app://'))
        );
      }

      function isAppAlreadyInstalled() {
        if (isPwaStandalone()) return true;
        try {
          if (localStorage.getItem('taj_pos_installed') === 'true') {
            return true;
          }
        } catch (e) {}
        return false;
      }

      function showInstallBanner() {
        if (isAppAlreadyInstalled()) return;
        const banner = document.getElementById('pwa-install-btn');
        if (banner) {
          banner.style.display = 'flex';
        }
      }

      function hideInstallBanner() {
        const banner = document.getElementById('pwa-install-btn');
        if (banner) {
          banner.style.display = 'none';
        }
      }

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('taj_pwa_prompt_ready', { detail: e }));
        if (!isAppAlreadyInstalled()) {
          showInstallBanner();
        }
      });

      window.addEventListener('appinstalled', function() {
        window.deferredInstallPrompt = null;
        try {
          localStorage.setItem('taj_pos_installed', 'true');
        } catch (e) {}
        hideInstallBanner();
        window.dispatchEvent(new CustomEvent('taj_pwa_app_installed'));
      });

      // Chromium getInstalledRelatedApps check
      if (typeof navigator !== 'undefined' && 'getInstalledRelatedApps' in navigator) {
        navigator.getInstalledRelatedApps().then(function(apps) {
          if (apps && apps.length > 0) {
            try {
              localStorage.setItem('taj_pos_installed', 'true');
            } catch (e) {}
            hideInstallBanner();
          }
        }).catch(function() {});
      }

      // Global direct install runner called by banner button
      window.triggerPwaInstall = async function() {
        if (window.deferredInstallPrompt) {
          try {
            await window.deferredInstallPrompt.prompt();
            const choice = await window.deferredInstallPrompt.userChoice;
            if (choice && choice.outcome === 'accepted') {
              try {
                localStorage.setItem('taj_pos_installed', 'true');
              } catch (e) {}
              hideInstallBanner();
              window.deferredInstallPrompt = null;
              window.dispatchEvent(new CustomEvent('taj_pwa_app_installed'));
            }
          } catch (err) {
            console.warn('Install prompt error:', err);
          }
        }
      };

      document.addEventListener('DOMContentLoaded', function() {
        if (isAppAlreadyInstalled()) {
          hideInstallBanner();
          return;
        }
        const installBtn = document.getElementById('pwa-actual-install-click');
        if (installBtn) {
          installBtn.addEventListener('click', function() {
            window.triggerPwaInstall();
          });
        }
        if (!isAppAlreadyInstalled() && window.deferredInstallPrompt) {
          showInstallBanner();
        }
      });
    </script>

  <body>
    <!-- ===== PWA INSTALL BANNER ===== -->
    <div id="pwa-install-btn" style="display: none; background: #ffffff; color: #2c3e50; padding: 10px 16px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; position: sticky; top: 0; left: 0; right: 0; z-index: 99999; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-bottom: 2px solid #27ae60; align-items: center; justify-content: center; gap: 10px;">
      <span style="font-size: 13px; font-weight: 600;">⚡ Install App for better experience!</span>
      <button id="pwa-actual-install-click" style="background: #27ae60; color: white; border: none; padding: 6px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 12px; transition: transform 0.1s;">Install</button>
      <button onclick="document.getElementById('pwa-install-btn').style.display='none'" style="background: transparent; border: none; font-size: 20px; cursor: pointer; color: #888; padding: 0 6px; line-height: 1;">&times;</button>
    </div>

    <div id="root"></div>
  </body>
