    <script>
      // Early Service Worker registration so Chrome installability criteria is immediately satisfied
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function(e) {
            console.warn('SW register notice:', e);
          });
        });
      }

      // Immediately capture beforeinstallprompt before any framework loads
      window.deferredInstallPrompt = null;

      function isPwaStandalone() {
        return Boolean(
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: window-controls-overlay)').matches ||
          window.matchMedia('(display-mode: minimal-ui)').matches ||
          window.navigator.standalone === true ||
          (document.referrer && document.referrer.includes('android-app://'))
        );
      }

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('taj_pwa_prompt_ready', { detail: e }));
      });

      window.addEventListener('appinstalled', function() {
        window.deferredInstallPrompt = null;
        try {
          localStorage.setItem('taj_pos_installed', 'true');
        } catch (e) {}
        window.dispatchEvent(new CustomEvent('taj_pwa_app_installed'));
      });

      // Global direct install runner called by in-app buttons
      window.triggerPwaInstall = async function() {
        if (window.deferredInstallPrompt) {
          try {
            await window.deferredInstallPrompt.prompt();
            var choice = await window.deferredInstallPrompt.userChoice;
            if (choice && choice.outcome === 'accepted') {
              try {
                localStorage.setItem('taj_pos_installed', 'true');
              } catch (e) {}
              window.deferredInstallPrompt = null;
              window.dispatchEvent(new CustomEvent('taj_pwa_app_installed'));
              return true;
            }
          } catch (err) {
            console.warn('Install prompt error:', err);
          }
        }
        return false;
      };
    </script>

    <script>
      (function() {
        function purgeNetlifyBadge() {
          var sel = [
            '#netlify-badge',
            '.netlify-badge',
            '#netlify-drawer',
            '#netlify-drawer-container',
            '[data-netlify-drawer]',
            '[data-netlify-deploy-id]',
            'iframe[src*="netlify"]',
            'iframe[id*="netlify"]',
            'netlify-drawer',
            '[aria-label*="Netlify" i]',
            'a[href*="netlify.com"]'
          ];
          sel.forEach(function(s) {
            document.querySelectorAll(s).forEach(function(el) {
              try { el.remove(); } catch(e) { el.style.display = 'none'; }
            });
          });
          document.querySelectorAll('div, button, a').forEach(function(el) {
            if (el.children.length <= 4 && el.innerText && el.innerText.trim().toLowerCase().includes('powered by netlify')) {
              try { el.remove(); } catch(e) { el.style.display = 'none'; }
            }
          });
        }
        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', purgeNetlifyBadge);
          window.addEventListener('load', purgeNetlifyBadge);
          try {
            var obs = new MutationObserver(function() {
              purgeNetlifyBadge();
            });
            obs.observe(document.documentElement, { childList: true, subtree: true });
          } catch(e) {}
        }
      })();
    </script>
