<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NH POS Shop - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 paths to main app with query string
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoPath = '/' + l.pathname.split('/').slice(1, 1 + pathSegmentsToKeep).join('/');
      // If deployed in dist or root
      if (l.pathname.includes('/dist')) {
        l.replace(repoPath + '/dist/');
      } else {
        l.replace(repoPath + '/');
      }
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">
      NH POS Shop لوڈ ہو رہا ہے، براہ کرم انتظار کریں...
    </p>
  </body>
</html>
